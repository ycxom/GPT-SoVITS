<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>请求列表 - API统计</title>
    <link rel="icon" href="https://ghfast.top/https://raw.githubusercontent.com/ycxom/VPetLLM/refs/heads/main/3000_VPetLLM/icon.png">
    <link rel="stylesheet" href="/stats/static/common.css">
    <script src="/stats/static/common.js"></script>
    <link rel="stylesheet" href="/stats/static/requests.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 请求列表</h1>
            <p>查看和管理所有API请求记录</p>
            <div class="nav">
                <a href="/stats">← 返回仪表板</a>
                <a href="/stats/security">🔒 安全防护日志</a>
            </div>
        </div>
        
        <div class="controls">
            <div>
                <label>显示数量:</label>
                <select id="page-size" onchange="changePageSize()">
                    <option value="20" selected>20条</option>
                    <option value="30">30条</option>
                    <option value="50">50条</option>
                    <option value="100">100条</option>
                </select>
            </div>
            
            <div>
                <label>筛选状态:</label>
                <select id="filter-status" onchange="loadRequests()">
                    <option value="all">全部</option>
                    <option value="success">成功</option>
                    <option value="failed">失败</option>
                </select>
            </div>
            
            <div>
                <button onclick="loadRequests()">🔄 刷新</button>
                <button onclick="exportData()">📥 导出</button>
            </div>
        </div>
        
        <div class="table-container">
            <div id="loading" class="loading">
                <p>加载中...</p>
            </div>
            
            <table id="requests-table" style="display: none;">
                <thead>
                    <tr>
                        <th class="sortable" data-sort="id">ID</th>
                        <th class="sortable" data-sort="timestamp">时间</th>
                        <th class="sortable" data-sort="client_ip">IP地址</th>
                        <th class="sortable" data-sort="api_key">API Key</th>
                        <th class="sortable" data-sort="model_name">模型</th>
                        <th class="sortable" data-sort="text_length">文本长度</th>
                        <th class="sortable" data-sort="text_lang">语言</th>
                        <th class="sortable" data-sort="media_type">格式</th>
                        <th class="sortable" data-sort="processing_time">总时间</th>
                        <th class="sortable" data-sort="tts_time">TTS时间</th>
                        <th class="sortable" data-sort="success">状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
        
        <div class="pagination" id="pagination"></div>
    </div>
    
    <!-- 详情模态框 -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕ 关闭</button>
            <h2 style="margin-bottom: 20px;">📋 请求详情</h2>
            <div id="detail-content"></div>
        </div>
    </div>
    
    <script src="/stats/static/requests.js"></script>
</body>
</html>
