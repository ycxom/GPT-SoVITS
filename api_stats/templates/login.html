<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统计面板登录</title>
    <link rel="icon" href="https://ghfast.top/https://raw.githubusercontent.com/ycxom/VPetLLM/refs/heads/main/3000_VPetLLM/icon.png">
    <link rel="stylesheet" href="/stats/static/common.css">
    <script src="/stats/static/common.js"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: white;
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .login-header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: white;
            font-weight: 500;
            margin-bottom: 8px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        

        
        .login-btn {
            width: 100%;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>
    <div class="login-container glass-card fade-in">
        <div class="login-header">
            <h1>🔐 统计面板</h1>
            <p>请输入授权码以访问统计数据</p>
        </div>
        
        <!-- ERROR_PLACEHOLDER -->
        
        <form method="post" action="/stats/auth">
            <div class="form-group">
                <label for="auth_code">授权码</label>
                <input 
                    type="password" 
                    id="auth_code" 
                    name="auth_code" 
                    class="input"
                    placeholder="请输入授权码" 
                    required 
                    autofocus
                >
            </div>
            
            <button type="submit" class="btn btn-primary login-btn">登录</button>
        </form>
        
        <div class="login-footer">
            <p>默认授权码：GPT-SoVits</p>
            <p style="margin-top: 5px; font-size: 0.85em;">可在 api_config.yaml 中修改</p>
        </div>
    </div>
</body>
</html>
