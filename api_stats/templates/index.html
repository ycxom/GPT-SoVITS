<!DOCTYPE html>
<html lang="zh-CN">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .main-content {
            text-align: center;
            animation: fadeIn 1s ease-out;
        }
        
        .logo-container {
            margin-bottom: 30px;
        }
        
        .logo {
            width: 150px;
            height: 150px;
            margin: 0 auto;
            animation: float 3s ease-in-out infinite;
        }
        
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.3));
        }
        
        .title {
            font-size: 3em;
            font-weight: 700;
            color: white;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        @media (max-width: 768px) {
            .logo {
                width: 100px;
                height: 100px;
            }
            
            .title {
                font-size: 2em;
            }
            
            .subtitle {
                font-size: 1em;
            }
        }
    </style>
</head>
