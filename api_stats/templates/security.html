<!D
OCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全日志 - API统计</title>
    <link rel="icon" href="https://ghfast.top/https://raw.githubusercontent.com/ycxom/VPetLLM/refs/heads/main/3000_VPetLLM/icon.png">
    <link rel="stylesheet" href="/stats/static/common.css">
    <script src="/stats/static/common.js"></script>
    <link rel="stylesheet" href="/stats/static/requests.css">
    <link rel="stylesheet" href="/stats/static/security.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔒 安全防护日志</h1>
            <p>查看和管理恶意请求记录与IP黑名单</p>
            <div class="nav">
                <a href="/stats">← 返回仪表板</a>
                <a href="/stats/requests">📋 查看全部请求</a>
            </div>
        </div>
        
        <!-- 统计卡片 -->
        <div class="stats-cards" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
            <div class="stat-card" style="color: white; padding: 20px; border-radius: 8px; text-align: center;">
                <div style="font-size: 14px; opacity: 0.9; margin-bottom: 10px;">恶意请求</div>
                <div style="font-size: 32px; font-weight: bold;" id="malicious-count">0</div>
            </div>
            <div class="stat-card" style="color: white; padding: 20px; border-radius: 8px; text-align: center;">
                <div style="font-size: 14px; opacity: 0.9; margin-bottom: 10px;">黑名单IP</div>
                <div style="font-size: 32px; font-weight: bold;" id="blacklist-count">0</div>
            </div>
        </div>
        
        <!-- 标签页切换 -->
        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('malicious')">恶意请求</button>
            <button class="tab-button" onclick="switchTab('blacklist')">IP黑名单</button>
        </div>
        
        <!-- 恶意请求标签页 -->
        <div id="malicious-tab" class="tab-content active">
            <div class="controls">
                <div>
                    <label>显示数量:</label>
                    <select id="malicious-page-size" onchange="loadMaliciousRequests()">
                        <option value="20" selected>20条</option>
                        <option value="30">30条</option>
                        <option value="50">50条</option>
                        <option value="100">100条</option>
                    </select>
                </div>
                
                <div>
                    <label>威胁类型:</label>
                    <select id="threat-type-filter" onchange="loadMaliciousRequests()">
                        <option value="all">全部</option>
                        <option value="suspicious_path">可疑路径</option>
                        <option value="malicious_pattern">恶意模式</option>
                    </select>
                </div>
                
                <div>
                    <button onclick="loadMaliciousRequests()">🔄 刷新</button>
                    <button onclick="exportMaliciousData()">📥 导出</button>
                </div>
            </div>
            
            <div class="table-container">
                <div id="malicious-loading" class="loading">
                    <p>加载中...</p>
                </div>
                
                <table id="malicious-table" style="display: none;">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>时间</th>
                            <th>IP地址</th>
                            <th>方法</th>
                            <th>路径</th>
                            <th>威胁类型</th>
                            <th>威胁详情</th>
                            <th>User-Agent</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="malicious-table-body"></tbody>
                </table>
            </div>
        </div>
        
        <!-- IP黑名单标签页 -->
        <div id="blacklist-tab" class="tab-content" style="display: none;">
            <div class="controls">
                <div>
                    <button onclick="loadBlacklist()">🔄 刷新</button>
                    <button onclick="exportBlacklistData()">📥 导出</button>
                </div>
            </div>
            
            <div class="table-container">
                <div id="blacklist-loading" class="loading">
                    <p>加载中...</p>
                </div>
                
                <table id="blacklist-table" style="display: none;">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>IP地址</th>
                            <th>威胁次数</th>
                            <th>原因</th>
                            <th>首次发现</th>
                            <th>最后发现</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="blacklist-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- 详情模态框 -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕ 关闭</button>
            <h2 style="margin-bottom: 20px;">🔒 请求详情</h2>
            <div id="detail-content"></div>
        </div>
    </div>
    
    <script src="/stats/static/security.js"></script>
</body>
</html>
