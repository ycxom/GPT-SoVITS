services:
  api-server:
    image: gpt-sovits-api:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.12"
        CUDA_VERSION: "${CUDA_VERSION:-12.8}"
        WORKFLOW: "true"
        DOWNLOAD_SOURCE: "${DOWNLOAD_SOURCE:-auto}"
    container_name: gpt-sovits-api
    ports:
      - "${API_PORT:-9880}:9880"
    volumes:
      - ./models:/workspace/GPT-SoVITS/models
      - ./api_config.yaml:/workspace/GPT-SoVITS/api_config.yaml:ro
    environment:
      is_half: "${IS_HALF:-true}"
    shm_size: "16g"
    restart: unless-stopped
    gpus: all
    stop_grace_period: 30s
